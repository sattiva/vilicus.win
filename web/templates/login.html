<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{.BotName}} Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #030304;
            --panel: rgba(14, 14, 18, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --fg: #f4f4f7;
            --muted: #888892;
            --accent: #5865F2;
            --accent-hover: #4752C4;
            --accent-glow: rgba(88, 101, 242, 0.25);
            --font-main: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .fog-bg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: var(--bg);
            overflow: hidden;
            pointer-events: none;
        }
        #bgCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            opacity: 0.85;
        }
        .fog-dot-grid-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: radial-gradient(circle, transparent 40%, #030304 43%);
            background-size: 4px 4px;
        }
        .login-box {
            width: 380px;
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 10;
        }
        .brand-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 14px var(--accent);
            margin: 0 auto 1rem auto;
        }
        .title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .desc {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 2rem;
        }
        .btn-discord {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-discord:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .discord-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .err {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 12.5px;
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>
    <div class="fog-bg">
        <canvas id="bgCanvas"></canvas>
        <div class="fog-dot-grid-overlay"></div>
    </div>

    <div class="login-box">
        <div class="brand-dot"></div>
        <div class="title">{{.BotName}}</div>
        <div class="desc">Admin Control Center</div>
        {{if .Error}}
        <div class="err">{{.Error}}</div>
        {{end}}
        <a href="/auth/discord" class="btn-discord">
            <svg class="discord-icon" viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a74.31,74.31,0,0,0,64.3,0c.87.69,1.76,1.37,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.94-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53S36,40.3,42.45,40.3C48.92,40.3,54,46,53.9,53,53.9,60,48.89,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.07-12.7,11.44-12.7C91.1,40.3,96.2,46,96.1,53,96.1,60,91.07,65.69,84.69,65.69Z"/>
            </svg>
            Authenticate with Discord
        </a>
    </div>

    <script>
    (function() {
        var canvas = document.getElementById('bgCanvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var w, h, particles = [];

        function resize() {
            w = canvas.width = window.innerWidth / 2;
            h = canvas.height = window.innerHeight / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        for (var i = 0; i < 30; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                r: Math.random() * 2 + 1
            });
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = "rgba(88, 101, 242, 0.25)";
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = w;
                if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h;
                if (p.y > h) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>
</body>
</html>
